version: '3.5'

services:
  redis:
    container_name: "${BOT_NAME}-redis"
    image: redis:alpine
    user: "root"
    restart: always
    volumes:
      - ./redis_data:/data
    expose:
      - 6379
    networks:
      - botnet

  #  http://pgconfigurator.cybertec.at/ For Postgres Configuration
  postgres:
    container_name: "${BOT_NAME}-postgres"
    image: postgres:13-alpine
    ports:
      - "127.0.0.1:${DB_OUT_PORT}:5432"
    restart: always
    volumes:
      - "./pgdata:/var/lib/postgresql/data"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
    command: "postgres -c max_connections=150
              -c shared_buffers=512MB -c effective_cache_size=1536MB
              -c maintenance_work_mem=128MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB
              -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200
              -c work_mem=3495kB -c min_wal_size=1GB -c max_wal_size=4GB -c max_worker_processes=2
              -c max_parallel_workers_per_gather=1 -c max_parallel_workers=2 -c max_parallel_maintenance_workers=1"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    networks:
      - botnet

  bot:
    container_name: "${BOT_NAME}-bot"
    expose:
      - 80
    stop_signal: SIGINT
    build:
      context: .
    restart: always
    env_file:
      - .env
    volumes:
      - .:/src
    networks:
      botnet: {}
      control-KKRIT:
        aliases:
          - schedule-control-KKRIT-bot
    depends_on:
      - postgres
      - redis

networks:
  botnet:
    driver: bridge
  control-KKRIT:
    name: control-KKRIT
    driver: bridge
